<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Fotos y videos · IDEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#FCB72D;--navy:#01275C;--ink:#0A1E3D;--ease:cubic-bezier(.22,1,.36,1);
    --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{min-height:100svh;font-family:var(--font);color:#fff;background:#1D4F95;overflow-x:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.noscroll{overflow:hidden}
  .bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(165deg,#3F86CF 0%,#2B67B0 45%,#1D4F95 100%);overflow:hidden}
  .bg i{position:absolute;border-radius:50%;opacity:.8;will-change:transform}
  .bg .b1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,rgba(159,211,250,.75),rgba(159,211,250,0) 65%);animation:m1 24s ease-in-out infinite alternate}
  .bg .b2{width:60vmax;height:60vmax;right:-25vmax;bottom:-25vmax;background:radial-gradient(circle,rgba(15,59,128,.9),rgba(15,59,128,0) 65%);animation:m2 28s ease-in-out infinite alternate}
  @keyframes m1{to{transform:translate3d(18vmax,12vmax,0) scale(1.1)}}
  @keyframes m2{to{transform:translate3d(-16vmax,-14vmax,0) scale(.9)}}
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .logo{fill:currentColor;stroke:none;display:block}

  header{display:flex;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 16px 6px}
  header svg{width:min(190px,52vw);height:auto;color:#fff;filter:drop-shadow(0 2px 10px rgba(1,23,55,.35))}
  .head{max-width:1100px;margin:0 auto;padding:22px 16px 8px;text-align:center;animation:up .9s var(--ease) both}
  .kick{font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#CFE4F7}
  h1{margin-top:10px;font-size:clamp(26px,5.4vw,46px);font-weight:800;line-height:1.08;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(1,23,55,.45);text-wrap:balance}
  .meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
  .meta span{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600}
  .meta span.svc{background:var(--gold);color:#1d1402;border-color:transparent}
  .hint{margin-top:14px;font-size:13.5px;color:#D9E9F8}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .grid{max-width:1100px;margin:18px auto 0;padding:0 16px calc(40px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  @media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
  .card{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
    cursor:pointer;opacity:0;transform:translateY(14px);animation:up .7s var(--ease) forwards;animation-delay:calc(var(--i) * 35ms)}
  .card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s,transform .6s var(--ease)}
  .card img.in{opacity:1}
  .card:hover img{transform:scale(1.05)}
  .card .vb{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:999px;background:rgba(1,23,55,.65);font-size:11.5px;font-weight:700}
  .card .vb .ic{width:13px;height:13px;fill:#fff;stroke:none}
  .card .dl{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(1,23,55,.6);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:.95}
  .card .dl:hover{background:var(--gold);color:#000}
  .card .dl .ic{width:17px;height:17px}

  .state{max-width:520px;margin:12vh auto 0;padding:0 24px;text-align:center}
  .state h2{font-size:24px;font-weight:800;margin:14px 0 8px}
  .state p{color:#D9E9F8;font-size:15px;line-height:1.5}
  .spin{width:38px;height:38px;margin:0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:var(--gold);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .state .big{width:56px;height:56px;margin:0 auto;color:var(--gold)}

  .lb{position:fixed;inset:0;z-index:20;background:rgba(1,16,38,.94);display:none;flex-direction:column}
  .lb.on{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}}
  .lb-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  .lb-top .n{flex:1;font-size:13px;font-weight:600;color:#BFD6EE}
  .btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:0;font:700 14px var(--font);cursor:pointer}
  .btn.gold{background:var(--gold);color:#000}
  .ib{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
  .ib:hover{background:rgba(255,255,255,.22)}
  .lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom))}
  .lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .lb-stage .fr{position:relative;width:min(100%,calc((100svh - 120px) * .5625));height:100%;max-height:100%;border-radius:10px;overflow:hidden;background:#000}
  .lb-stage .fr.h{width:min(100%,1100px);height:auto;aspect-ratio:16/9}
  .lb-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* Tapa el botón «abrir en una ventana nueva» del reproductor de Drive */
  .lb-stage .cap{position:absolute;top:0;right:0;width:64px;height:64px;z-index:2}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3}
  .nav.p{left:14px}.nav.n{right:14px}
  @media(max-width:720px){.nav{display:none}}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:30;
    padding:11px 18px;border-radius:999px;background:#fff;color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.35s var(--ease);pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .lsheet{position:fixed;inset:0;z-index:40;background:rgba(1,16,38,.55);display:none;align-items:flex-end;justify-content:center}
  .lsheet.on{display:flex;animation:fade .2s ease}
  .lsbox{width:min(100%,420px);margin:0 10px calc(12px + env(safe-area-inset-bottom));padding:20px 18px 14px;border-radius:20px;background:#fff;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:up .35s var(--ease)}
  .lsbox b{font-size:19px;font-weight:800}
  .lsbox span{font-size:13px;color:#5A7395;word-break:break-all}
  .lsbox .btn{width:100%;justify-content:center;height:50px;font-size:16px;margin-top:6px}
  .lsx{border:0;background:none;color:#5A7395;font:600 14px var(--font);padding:10px;cursor:pointer}
  footer{text-align:center;font-size:12px;color:#BFD6EE;padding:0 16px 28px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>

    var t='';
    var ev=String(r.evento||'').split(' / ')[0].trim(), partes=a.split(/\s+-\s+/), ult=partes[partes.length-1]||'';
    if(ev&&!/^general$/i.test(ev))t=ev;
    else if(partes.length>=4&&ult&&!/^general$/i.test(ult))t=ult;
    else if(/^EVENTOS\s*-/i.test(a)&&partes[1]&&!/^[A-Z]{3}$/.test(partes[1]))t=partes[1];
    else if(r.tipoEvento&&r.tipoEvento!=='Sin especificar')t=r.tipoEvento;
    var svc=String(r.servicio||'').replace(/^\d+_/,'').trim();
    if(!t)t=svc||'Fotos y videos';
    t=String(t).replace(/_/g,' ').replace(/\s+/g,' ').trim();
    return t.charAt(0).toUpperCase()+t.slice(1);
  }
  function fecha(a){var m=String(a).match(/(20\d{2})-(\d{2})-(\d{2})/);return m?(+m[3])+' de '+MESES[+m[2]-1]+' de '+m[1]:'';}

  obtener().then(function(d){
    var porAlbum={};
    (d.contenido||[]).forEach(function(r){
      if(!r||!r.driveId||String(r.driveId).indexOf('gphotos:')===0||!r.album)return;
      (porAlbum[r.album]=porAlbum[r.album]||[]).push(r);
    });
    var alb=null;
    Object.keys(porAlbum).some(function(a){if(codigo(a)===token){alb=a;return true;}return false;});
    if(!alb){ falla('Enlace no disponible','Este álbum ya no está disponible o el enlace está incompleto. Pídele a IDEA uno nuevo.'); return; }
    // Solo queda en memoria el álbum de este enlace.
    ITEMS=porAlbum[alb]; porAlbum=null; d=null;
    ITEMS.sort(function(x,y){return String(x.nombre||'').localeCompare(String(y.nombre||''),'es',{numeric:true});});
    pintar(alb);
  }).catch(function(){
    falla('No se pudo cargar','Revisa tu conexión e intenta de nuevo en unos minutos.');
  });

  function pintar(alb){
    var r0=ITEMS[0], t=titulo(alb,r0), f=fecha(alb);
    var nv=ITEMS.filter(function(r){return r.tipo==='Video';}).length, nf=ITEMS.length-nv;
    var svc=String(r0.servicio||'').replace(/^\d+_/,'').trim();
    var meta=[];
    if(svc&&svc.toLowerCase()!==t.toLowerCase())meta.push('<span class="svc">'+esc(svc.toUpperCase())+'</span>');
    if(r0.sede)meta.push('<span>'+esc(r0.sede)+'</span>');
    if(f)meta.push('<span>'+esc(f)+'</span>');
    var cuenta=[]; if(nf)cuenta.push(nf+(nf===1?' foto':' fotos')); if(nv)cuenta.push(nv+(nv===1?' video':' videos'));
    document.title=t+' · IDEA';
    var h='<section class="head"><div class="kick">Tus fotos y videos</div><h1>'+esc(t)+'</h1>'+
      (meta.length?'<div class="meta">'+meta.join('')+'</div>':'')+
      '<p class="hint">'+esc(cuenta.join(' · '))+' · Toca una para verla y descargarla</p></section><div class="grid" id="grid">';
    ITEMS.forEach(function(r,i){
      h+='<div class="card" data-i="'+i+'" style="--i:'+Math.min(i,30)+'"><img alt="" loading="lazy" data-src="https://drive.google.com/thumbnail?id='+encodeURIComponent(r.driveId)+'&sz=w400">'+
        (r.tipo==='Video'?'<span class="vb">'+ic('play')+'Video</span>':'')+
        '<button class="dl" data-dl="'+i+'" aria-label="Descargar">'+ic('dl')+'</button></div>';
    });
    h+='</div><footer>IDEA Aviation Corporation · Instituto de Especialidades Aeronáuticas</footer>';
    $('main').innerHTML=h;
    [].forEach.call(document.querySelectorAll('.card img'),function(im){
      im.onload=function(){im.classList.add('in');}; im.onerror=function(){im.style.display='none';};
      im.src=im.getAttribute('data-src');
    });
  }

  // Descarga directa: se baja el archivo aquí mismo (con la dirección de la galería, que es la que Google acepta)
  // y se entrega como archivo. En el teléfono se abre «Guardar imagen / Guardar video» para que quede en Fotos.
  var MIME={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',heic:'image/heic',heif:'image/heif',webp:'image/webp',
    mp4:'video/mp4',mov:'video/quicktime',m4v:'video/mp4'};
  var MOVIL=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var bajando=false, LISTO=null;
  function entregar(file){
    if(MOVIL&&navigator.canShare&&navigator.share){
      try{ if(navigator.canShare({files:[file]})){
        return navigator.share({files:[file]}).then(function(){LISTO=null;$('lsheet').classList.remove('on');},function(e){
          // Si el teléfono pide otro toque (tardó en bajar), se muestra el botón «Guardar».
          if(e&&e.name==='AbortError'){LISTO=null;$('lsheet').classList.remove('on');return;}
          LISTO=file; $('lsname').textContent=file.name; $('lsheet').classList.add('on');
        });
      } }catch(e){}
    }
    var u=URL.createObjectURL(file), a=document.createElement('a');
    a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},60000);
    LISTO=null; $('lsheet').classList.remove('on'); toast('Listo · revisa tus descargas');
  }
  function descargar(i){
    var r=ITEMS[i]; if(!r||bajando)return;
    bajando=true; toast('Descargando…');
    var nombre=r.nombre||('IDEA-'+r.driveId), ext=(nombre.split('.').pop()||'').toLowerCase();
    var url='https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(r.driveId)+'?alt=media&key='+KEY;
    fetch(url,{referrerPolicy:'strict-origin-when-cross-origin'}).then(function(res){
      if(!res.ok)throw new Error(res.status);
      var total=+res.headers.get('content-length')||0;
      if(!res.body||!res.body.getReader||!total)return res.blob();
      var rd=res.body.getReader(), partes=[], n=0, ult=0;
      function leer(){return rd.read().then(function(x){
        if(x.done)return new Blob(partes);
        partes.push(x.value); n+=x.value.length;
        var pc=Math.floor(n*100/total); if(pc-ult>=5){ult=pc;toast('Descargando… '+pc+'%');}
        return leer();
      });}
      return leer();
    }).then(function(blob){
      var file=new File([blob],nombre,{type:MIME[ext]||blob.type||'application/octet-stream'});
      return entregar(file);
    }).catch(function(){
      toast('No se pudo descargar. Revisa tu conexión e intenta de nuevo.');
    }).then(function(){bajando=false;});
  }

  function ver(i){
    POS=(i+ITEMS.length)%ITEMS.length; var r=ITEMS[POS], s=$('lbs'), id=encodeURIComponent(r.driveId);
    $('lbn').textContent=(POS+1)+' de '+ITEMS.length;
    var nav='<button class="ib nav p" id="lbp" aria-label="Anterior">'+ic('l')+'</button><button class="ib nav n" id="lbnx" aria-label="Siguiente">'+ic('r')+'</button>';
    if(r.tipo==='Video'){
      // Reproductor de Drive encerrado: sin ventanas nuevas ni salida a Drive.
      s.innerHTML=nav+'<div class="fr"><iframe sandbox="allow-scripts allow-same-origin" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer" src="https://drive.google.com/file/d/'+id+'/preview"></iframe><div class="cap"></div></div>';
    } else {
      s.innerHTML=nav+'<img alt="" src="https://drive.google.com/thumbnail?id='+id+'&sz=w1600">';
    }
    $('lbp').onclick=function(){ver(POS-1);}; $('lbnx').onclick=function(){ver(POS+1);};
  }
  function abrir(i){ver(i);$('lb').classList.add('on');document.body.classList.add('noscroll');}
  function cerrar(){$('lb').classList.remove('on');$('lbs').innerHTML='';document.body.classList.remove('noscroll');}

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-dl]'); if(t){e.stopPropagation();descargar(+t.getAttribute('data-dl'));return;}
    t=e.target.closest('.card'); if(t){abrir(+t.getAttribute('data-i'));}
  });
  $('lsgo').onclick=function(){if(LISTO)entregar(LISTO);};
  $('lsx').onclick=function(){LISTO=null;$('lsheet').classList.remove('on');};
  $('lbx').onclick=cerrar; $('lbdl').onclick=function(){descargar(POS);};
  document.addEventListener('keydown',function(e){
    if(!$('lb').classList.contains('on'))return;
    if(e.key==='Escape')cerrar(); else if(e.key==='ArrowLeft')ver(POS-1); else if(e.key==='ArrowRight')ver(POS+1);
  });
  // Deslizar en el teléfono
  var x0=null;
  $('lbs').addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  $('lbs').addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)ver(POS+(dx<0?1:-1));},{passive:true});
  document.addEventListener('contextmenu',function(e){if(e.target.closest('.lb-stage'))e.preventDefault();});
})();
</script>
</body>
