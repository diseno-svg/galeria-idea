<style>
  /* ── Línea gráfica IDEA: azul marino #01275C · dorado #FCB72D · celeste #87B3D6 ── */
  :root{
    --bg:#020b1a; --bg2:#041229; --surface:#0a1b38; --surface2:#10264b; --surface3:#17315d;
    --line:rgba(135,179,214,.14); --line2:rgba(135,179,214,.26);
    --text:#f2f5fa; --muted:#94a8c6; --dim:#62789b;
    --gold:#FCB72D; --gold2:#e8a414; --gold-ink:#1d1402; --sky:#87B3D6; --navy:#01275C;
    --gcols:2; --ggap:6px; --cr:12px;
    --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --font-d:'Bebas Neue','Arial Narrow',Impact,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    /* nombres que usa el calendario */
    --panel:var(--surface); --panel2:var(--surface2); --accent:var(--gold);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{background:transparent}
  html,body{margin:0;padding:0;color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  /* ── Fondo vivo: auroras, rutas de vuelo y estrellas (solo transform/opacity) ── */
  .bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
  .aur{position:absolute;border-radius:50%;will-change:transform}
  .aur.a1{width:120vmax;height:80vmax;left:-35vmax;top:-45vmax;
    background:radial-gradient(closest-side,rgba(13,74,168,.55),rgba(1,39,92,.25) 55%,transparent);animation:drift1 26s ease-in-out infinite alternate}
  .aur.a2{width:90vmax;height:70vmax;right:-40vmax;top:10vh;
    background:radial-gradient(closest-side,rgba(135,179,214,.14),transparent);animation:drift2 32s ease-in-out infinite alternate}
  .aur.a3{width:70vmax;height:60vmax;left:-10vmax;bottom:-35vmax;
    background:radial-gradient(closest-side,rgba(252,183,45,.07),transparent);animation:drift3 38s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate3d(18vmax,10vmax,0) scale(1.12)}}
  @keyframes drift2{to{transform:translate3d(-16vmax,14vmax,0) scale(.9)}}
  @keyframes drift3{to{transform:translate3d(20vmax,-12vmax,0) scale(1.15)}}
  .routes{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
  .routes .rt{fill:none;stroke:rgba(135,179,214,.16);stroke-width:1;stroke-dasharray:2 7}
  .routes .cm{fill:none;stroke:url(#gComet);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:70 1400;animation:comet 14s linear infinite}
  .routes .cm.c2{animation-duration:19s;animation-delay:-7s}
  @keyframes comet{from{stroke-dashoffset:1470}to{stroke-dashoffset:0}}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#dbe8f7;opacity:.08;animation:tw 4s ease-in-out infinite}
  @keyframes tw{50%{opacity:.45;transform:scale(1.3)}}
  @media (prefers-reduced-motion:reduce){ .aur,.routes .cm,.stars i,.hero-route .cm{animation:none!important} }
  body.noscroll{overflow:hidden}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}
  .ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ic.fill{fill:currentColor;stroke:none}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px}

  /* ── Encabezado ── */
  .hdr{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:linear-gradient(180deg,rgba(2,11,26,.97),rgba(2,11,26,.9));
    -webkit-backdrop-filter:saturate(140%) blur(14px);backdrop-filter:saturate(140%) blur(14px);
    border-bottom:1px solid var(--line);transition:transform .32s var(--ease)}
  .hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(252,183,45,.55) 30%,rgba(135,179,214,.4) 70%,transparent)}
  .hdr.hide{transform:translateY(-101%)}
  .wrap{max-width:1440px;margin:0 auto}
  .bar{display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;background:none;border:0;padding:0;text-align:left}
  .logo{fill:currentColor;stroke:none;display:block}
  .brand-iso{width:44px;height:36px;color:#fff;flex:none;filter:drop-shadow(0 2px 10px rgba(135,179,214,.35))}
  .brand-sep{width:1px;height:30px;background:linear-gradient(180deg,transparent,rgba(252,183,45,.7),transparent);flex:none}
  .brand-txt{display:flex;flex-direction:column;line-height:1;min-width:0}
  .brand-txt .b1{font-family:var(--font-d);font-size:25px;letter-spacing:.07em;color:var(--gold);line-height:.9}
  .brand-txt .b2{font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px;white-space:nowrap}
  .bar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
  .count{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);color:var(--text);transition:background .15s,border-color .15s}
  .ibtn:hover{border-color:var(--line2);background:var(--surface2)}
  .ibtn .ic{width:19px;height:19px}

  .searchrow{display:flex;gap:8px;margin-top:12px}
  .search{flex:1;position:relative;display:flex;align-items:center;min-width:0}
  .search>.ic{position:absolute;left:13px;color:var(--dim);pointer-events:none}
  .search input{width:100%;height:42px;padding:0 38px 0 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-family:var(--font);font-size:15px;font-weight:500;outline:none;
    transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--dim);font-weight:500}
  .search input:focus{border-color:rgba(252,183,45,.6);box-shadow:0 0 0 3px rgba(252,183,45,.14)}
  .qclear{position:absolute;right:6px;width:30px;height:30px;border-radius:9px;border:0;background:transparent;
    color:var(--muted);cursor:pointer;display:none;place-items:center}
  .qclear.show{display:grid}
  .qclear .ic{width:16px;height:16px}
  .fbtn{position:relative;width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;
    background:var(--surface);border:1px solid var(--line);color:var(--text)}
  .fbtn.active{border-color:rgba(252,183,45,.55);color:var(--gold)}
  .fbtn .n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;display:none;place-items:center;
    box-shadow:0 0 0 2px var(--bg)}
  .fbtn.active .n{display:grid}

  .seg{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .seg::-webkit-scrollbar{display:none}
  .seg-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;flex:none;border-radius:999px;cursor:pointer;
    white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;
    transition:background .18s,color .18s,border-color .18s}
  .seg-b .ic{width:15px;height:15px}
  .seg-b:hover{color:var(--text);border-color:var(--line2)}
  .seg-b.active{background:linear-gradient(180deg,#ffc84f,var(--gold));border-color:var(--gold);color:var(--gold-ink);
    box-shadow:0 4px 14px -6px rgba(252,183,45,.7)}
  .seg-b#qf-fav.active .ic{fill:currentColor}

  .chips{display:none;gap:6px;flex-wrap:wrap;margin-top:10px}
  .fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 11px;border-radius:999px;cursor:pointer;
    font-size:12px;font-weight:600;color:#ffd98a;background:rgba(252,183,45,.1);border:1px solid rgba(252,183,45,.32)}
  .fchip .ic{width:14px;height:14px;opacity:.8}
  .fchip:hover{background:rgba(252,183,45,.18)}

  /* ── Galería ── */
  main{padding:6px 16px calc(120px + env(safe-area-inset-bottom));touch-action:pan-y;max-width:1440px;margin:0 auto}
  .grp{margin-top:26px}
  .grp:first-child{margin-top:18px}
  .ghead{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px}
  .ghead-t{min-width:0;flex:1}
  .gt{font-family:var(--font-d);font-size:26px;line-height:.95;letter-spacing:.03em;color:var(--text);
    overflow-wrap:anywhere;position:relative;padding-left:14px}
  .gt::before{content:"";position:absolute;left:0;top:2px;bottom:3px;width:4px;border-radius:2px;
    background:linear-gradient(180deg,var(--gold),#e58a00)}
  .gm{padding-left:14px}
  .ghead{position:relative;padding-bottom:10px}
  .ghead::after{content:"";position:absolute;left:14px;right:0;bottom:0;height:1px;
    background:linear-gradient(90deg,rgba(252,183,45,.45),rgba(135,179,214,.12) 40%,transparent)}
  .gm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;margin-top:6px;font-size:12px;font-weight:500;color:var(--muted)}
  .gm>span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--dim);
    margin:0 8px;vertical-align:middle;position:relative;top:-1px}
  .gm .svc{color:var(--gold);font-weight:700;letter-spacing:.04em}
  .gm .gpb{display:inline-flex;align-items:center;gap:4px;color:var(--sky);font-weight:600}
  .gm .gpb .ic{width:13px;height:13px}
  .gn{flex:none;font-size:12px;font-weight:600;color:var(--dim);padding-bottom:2px;font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:repeat(var(--gcols),1fr);gap:var(--ggap)}
  .card{position:relative;background:var(--surface);border-radius:var(--cr);overflow:hidden;cursor:pointer;aspect-ratio:1/1;
    content-visibility:auto;contain-intrinsic-size:180px 180px;isolation:isolate;
    transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .card:active{transform:scale(.97)}
  .card .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.08);
    transition:opacity .55s ease,transform .8s var(--ease)}
  .card .thumb.in{opacity:1;transform:none}
  .card .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}
  .card .ph .ic{width:26px;height:26px;stroke-width:1.5}
  .card .ph.spin{background:linear-gradient(110deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);
    background-size:220% 100%;animation:sh 1.4s linear infinite}
  .card .ph.spin .ic{display:none}
  @keyframes sh{to{background-position:-220% 0}}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none}
  .vb{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
    background:rgba(2,11,26,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;pointer-events:none}
  .vb .ic{width:11px;height:11px;margin-left:1px}
  .card .fav{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;
    display:grid;place-items:center;background:rgba(2,11,26,.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    color:rgba(255,255,255,.9);opacity:.95;transition:opacity .2s,transform .15s;z-index:2}
  .card .fav .ic{width:14px;height:14px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
  .card .fav.on{color:var(--gold)}
  .card .fav.on .ic{fill:currentColor}
  .card .fav:active{transform:scale(.85)}
  .card.gp{background:linear-gradient(150deg,#0e2f63,#071a38 70%)}
  .gpin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    text-align:center;padding:10px;color:var(--sky)}
  .gpin .ic{width:26px;height:26px;stroke-width:1.5}
  .gpin b{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .gpin small{font-size:10.5px;font-weight:600;color:var(--muted)}
  /* cuadrícula densa (4+ columnas al pellizcar) */
  body.gcols-dense .card .fav:not(.on){opacity:0;pointer-events:none}
  body.gcols-dense .card .fav{top:3px;right:3px;width:18px;height:18px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
  body.gcols-dense .card .fav .ic{width:12px;height:12px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
  body.gcols-dense .vb{right:3px;bottom:3px;width:16px;height:16px}
  body.gcols-dense .vb .ic{width:8px;height:8px}
  body.gcols-dense .gpin b,body.gcols-dense .gpin small{display:none}
  @media (hover:hover) and (pointer:fine){
    .card:hover{box-shadow:0 0 0 2px var(--gold),0 14px 34px rgba(0,0,0,.5)}
    .card:hover .thumb.in{transform:scale(1.05)}
    .card:active{transform:none}
    .card .fav:not(.on){opacity:0}
    .card:hover .fav{opacity:1}
  }

  .skel{display:grid;grid-template-columns:repeat(var(--gcols),1fr);gap:var(--ggap);margin-top:18px}
  .skel div{aspect-ratio:1/1;border-radius:var(--cr);background:linear-gradient(110deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);
    background-size:220% 100%;animation:sh 1.4s linear infinite}
  .skel-t{width:55%;height:22px;border-radius:6px;margin-top:18px;background:var(--surface)}
  .state{text-align:center;padding:90px 24px;color:var(--muted);font-size:14px;line-height:1.5}
  .state .ic{width:40px;height:40px;color:var(--dim);stroke-width:1.4;margin-bottom:14px}
  .state .big{font-family:var(--font-d);font-size:30px;letter-spacing:.04em;color:var(--text);margin-bottom:4px}
  .state .btn{margin:20px auto 0;display:inline-flex}

  /* ── Botones ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:13px;
    font-size:14px;font-weight:700;cursor:pointer;border:1px solid transparent;transition:filter .15s,background .15s}
  .btn .ic{width:18px;height:18px}
  .btn.gold{background:var(--gold);color:var(--gold-ink)}
  .btn.gold:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;border-color:var(--line2);color:var(--text)}
  .btn.ghost:hover{background:var(--surface2)}

  /* ── Hojas (filtros y menú) ── */
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(1,5,13,.55);opacity:0;pointer-events:none;transition:opacity .25s;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:88dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0c2146,#081936);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
    box-shadow:0 -20px 60px rgba(0,0,0,.5);transform:translateY(104%);transition:transform .34s var(--ease);visibility:hidden}
  .sheet.open{transform:none;visibility:visible}
  .sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:9px auto 0;flex:none}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 6px;flex:none}
  .sheet-head h2{margin:0;font-family:var(--font-d);font-weight:400;font-size:28px;letter-spacing:.04em}
  .sheet-body{padding:8px 20px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet-foot{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
  .sheet-foot .btn{flex:1}
  .sheet-foot .btn.gold{flex:1.6}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fld{display:flex;flex-direction:column;gap:6px;min-width:0}
  .fld>span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .fld select{width:100%;height:46px;padding:0 34px 0 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2387B3D6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center;
    color:var(--text);font-family:var(--font);font-size:14px;font-weight:600;outline:none;cursor:pointer;
    -webkit-appearance:none;appearance:none;text-overflow:ellipsis}
  .fld select:focus{border-color:rgba(252,183,45,.6);box-shadow:0 0 0 3px rgba(252,183,45,.14)}
  .fld select.set{border-color:rgba(252,183,45,.55);color:#ffd98a}
  .mlist{display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
  .mitem{display:flex;align-items:center;gap:14px;width:100%;padding:12px 10px;border-radius:14px;border:0;background:transparent;
    cursor:pointer;text-align:left;transition:background .15s}
  .mitem:hover{background:rgba(135,179,214,.07)}
  .mitem:disabled{opacity:.6;cursor:default}
  .mico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--surface2);color:var(--gold);
    border:1px solid var(--line)}
  .mico .ic{width:20px;height:20px}
  .mitem b{display:block;font-size:15px;font-weight:600;color:var(--text)}
  .mitem small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
  .mitem.busy .mico .ic{animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ── Visor ── */
  .lb{position:fixed;inset:0;z-index:60;background:#01060f;display:none;grid-template-columns:1fr 360px;overflow:hidden}
  .lb.show{display:grid;animation:fade .22s ease}
  .lb-amb{position:absolute;inset:-10%;z-index:0;background-size:cover;background-position:center;opacity:0;
    filter:blur(40px) saturate(1.3);transform:scale(1.1);transition:opacity .6s ease;pointer-events:none}
  .lb-amb.on{opacity:.42}
  .lb::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(1,6,15,.75))}
  .lb-stage,.lb-side{position:relative;z-index:1}
  .lb-stage img{animation:pop .45s var(--ease)}
  @keyframes pop{from{opacity:0;transform:scale(.965)}}
  @keyframes fade{from{opacity:0}}
  .lb-stage{position:relative;display:grid;place-items:center;padding:24px;overflow:hidden;min-width:0}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:calc(100dvh - 48px);border-radius:8px;object-fit:contain;background:#000;
    box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .lb-top{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 22px;background:linear-gradient(180deg,rgba(1,6,15,.75),transparent);pointer-events:none}
  .lb-top>*{pointer-events:auto}
  .lb-count{font-size:13px;font-weight:600;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums;padding-left:4px}
  .glass{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid rgba(255,255,255,.12);
    background:rgba(10,27,56,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff}
  .glass:hover{background:rgba(16,38,75,.8)}
  .lb-close{margin-left:auto}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:48px;height:48px}
  .lb-nav .ic{width:22px;height:22px}
  .lb-nav.prev{left:16px}.lb-nav.next{right:16px}
  .lb-nav[disabled]{opacity:0;pointer-events:none}
  .spinbox{display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px;font-size:14px}
  .spinbox .ic{width:34px;height:34px;animation:rot 1s linear infinite;color:var(--gold)}
  .gpstage{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:320px;padding:20px}
  .gpstage>.ic{width:46px;height:46px;color:var(--sky);stroke-width:1.3}
  .gpstage h3{margin:0;font-family:var(--font-d);font-weight:400;font-size:30px;letter-spacing:.04em}
  .gpstage p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
  .lb-side{background:linear-gradient(180deg,#0a1b38,#061430);border-left:1px solid var(--line);padding:30px 24px;overflow-y:auto}
  .lbt{font-family:var(--font-d);font-size:32px;line-height:.95;letter-spacing:.03em;overflow-wrap:anywhere}
  .lbm{margin-top:8px}
  .lbm .gm{padding-left:0}
  .lb-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 6px}
  .lb-actions.three{grid-template-columns:repeat(3,1fr)}
  .act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;height:60px;border-radius:14px;cursor:pointer;
    background:var(--surface2);border:1px solid var(--line);color:var(--text);font-size:11px;font-weight:600;transition:background .15s}
  .act:hover{background:var(--surface3)}
  .act .ic{width:20px;height:20px}
  .act.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
  .act.gold:hover{filter:brightness(1.06);background:var(--gold)}
  .act.on{color:var(--gold)}
  .act.on .ic{fill:currentColor}
  .act.wide{grid-column:span 2}
  .lb-meta{margin-top:14px;border-top:1px solid var(--line)}
  .kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv .k{color:var(--muted);font-weight:500;flex:none}
  .kv .v{text-align:right;font-weight:600;overflow-wrap:anywhere}
  .lb-toggle-row{display:none}

  /* ── Aviso ── */
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,140%);
    display:flex;align-items:center;gap:10px;max-width:min(420px,calc(100vw - 32px));padding:12px 18px;border-radius:999px;
    background:rgba(16,38,75,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line2);
    font-size:13px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.5);transition:transform .32s var(--ease)}
  .toast::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
  .toast{visibility:hidden;transform:translate(-50%,calc(100% + 40px))}
  .toast.show{transform:translate(-50%,0);visibility:visible}

  /* ── Portada animada al abrir ── */
  .splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 40%,#0b3a80 0%,#03122b 55%,#01060f 100%);transition:opacity .6s ease,visibility .6s}
  .splash.out{opacity:0;visibility:hidden}
  .splash.out .sp-logo{transform:scale(1.06) translateY(-6px)}
  .sp-route{position:absolute;left:50%;top:50%;width:min(560px,120vw);transform:translate(-50%,-112%);overflow:visible}
  .sp-route path{fill:none;stroke:rgba(252,183,45,.55);stroke-width:1.4;stroke-dasharray:3 7}
  .sp-route .draw{stroke:url(#gComet);stroke-width:2;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s .2s var(--ease) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .sp-logo{width:min(300px,72vw);color:#fff;opacity:0;animation:rise .9s .15s var(--ease) forwards;transition:transform .6s var(--ease);
    filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
  .sp-logo svg{width:100%;height:auto}
  .sp-sub{font-size:11px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--sky);opacity:0;animation:rise .8s .45s var(--ease) forwards}
  .sp-bar{width:120px;height:2px;border-radius:2px;background:rgba(135,179,214,.18);overflow:hidden;opacity:0;animation:rise .6s .6s ease forwards}
  .sp-bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:load 1.1s ease-in-out infinite}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes load{from{transform:translateX(-110%)}to{transform:translateX(280%)}}

  /* ── Portada de la galería (solo sin filtros) ── */
  .hero{position:relative;max-width:1440px;margin:0 auto;padding:26px 16px 6px;overflow:hidden}
  .hero.off{display:none}
  .hero-in{position:relative;z-index:1}
  .hero-logo{width:170px;color:#fff;opacity:.95}
  .hero-logo svg{width:100%;height:auto}
  .hero-kicker{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--sky)}
  .hero-kicker::before{content:"";width:22px;height:1px;background:var(--gold)}
  .hero h1{margin:10px 0 0;font-family:var(--font-d);font-weight:400;font-size:42px;line-height:.9;letter-spacing:.02em}
  .hero h1 span{background:linear-gradient(90deg,#ffd46e,var(--gold) 45%,#e58a00);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:8px 0 0;font-size:13px;font-weight:500;color:var(--muted);max-width:420px;line-height:1.45}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;max-width:560px}
  .st{padding:10px 10px 9px;border-radius:14px;background:linear-gradient(180deg,rgba(16,38,75,.75),rgba(10,27,56,.55));
    border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .st b{display:block;font-family:var(--font-d);font-weight:400;font-size:26px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
  .st small{display:block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .st:first-child b{color:var(--gold)}
  .hero-route{position:absolute;right:-60px;top:-10px;width:420px;height:220px;z-index:0;opacity:.9;overflow:visible}
  .hero-route .rt{fill:none;stroke:rgba(135,179,214,.22);stroke-width:1.2;stroke-dasharray:3 7}
  .hero-route .cm{fill:none;stroke:url(#gComet);stroke-width:2;stroke-linecap:round;stroke-dasharray:80 900;animation:comet2 7s linear infinite}
  .hero-route .pl{fill:var(--gold)}
  @keyframes comet2{from{stroke-dashoffset:980}to{stroke-dashoffset:0}}
  .hero .fade-in{opacity:0;animation:rise .8s var(--ease) forwards}
  .hero-mark{display:none}

  /* ── Escritorio ── */
  @media(min-width:721px){
    .hdr{padding:14px 28px 12px}
    .bar{gap:18px}
    .searchrow{margin-top:0;flex:1;max-width:620px;margin-left:28px}
    .hdr .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:0}
    .bar{display:contents}
    .brand{grid-column:1;grid-row:1}
    .searchrow{grid-column:2;grid-row:1}
    .bar-r{grid-column:3;grid-row:1;margin-left:18px}
    .seg{grid-column:1/-1;grid-row:2;margin-top:12px}
    .chips{grid-column:1/-1;grid-row:3}
    main{padding:8px 28px 80px}
    .grid,.skel{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
    .card{--cr:14px;border-radius:14px}
    .gt{font-size:30px}
    .hero{padding:40px 28px 10px}
    .hero-logo{width:220px}
    .hero h1{font-size:60px}
    .hero p{font-size:14px}
    .hero-route{right:6%;top:0;width:620px;height:280px}
    .hero-mark{display:block;position:absolute;right:max(28px,calc((100vw - 1440px)/2 + 28px));top:58px;width:360px;color:#fff;opacity:0;z-index:1;

    .lb-actions{grid-template-columns:repeat(3,1fr)}

.caltable{width:100%;border-collapse:collapse;font-size:13px}.caltable th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);white-space:nowrap}.caltable td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:middle}.caltable tr:hover td{background:var(--panel)}.cpill{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:600;font-size:12px;color:#16202e;white-space:nowrap}.cnum{color:var(--muted)}.cempty{color:var(--dim)}
.calviews{display:flex;gap:6px}.calviewbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)}.calviewbtn.active{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}.calctrl{display:flex;align-items:center;gap:8px;margin-left:auto}.calnav{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:16px}.callabel{font-weight:700;font-size:15px;min-width:150px;text-align:center;text-transform:capitalize}.calanchor{margin:0 0 14px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.calanchor select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}.calmonth{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.caldow{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:4px 0}.calcell{min-height:100px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 7px;overflow:hidden}.calcell.empty{background:transparent;border-color:transparent}.calcell .dnum{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}.calcell.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.calcell.today .dnum{color:var(--gold)}.calev{font-size:11px;border-radius:6px;padding:3px 5px;margin-bottom:4px;color:#16202e;line-height:1.25}.calev .es{font-weight:700;display:block}.calev .ep{display:block;font-size:10px;opacity:.9}

    </div>
  </div>
</section>

<script>
  // ── Fuente de datos ──
  // Página estática en GitHub Pages. Los datos llegan de un JSON en Drive que un
  // script de Apps Script regenera cada 15 min; se lee con una API key de Google
  // restringida a Drive API + este dominio.
  var DRIVE_API_KEY='AIzaSyDG8OEUiJTqQdNck1NJZhOpD36Q1VBaAyQ';
  var DATOS_URL='https://www.googleapis.com/drive/v3/files/1eURdGqo8-mjYhzMJttVHpCFgzEoa-hd1?alt=media&key='+DRIVE_API_KEY;
  // Registro Drive → Airtable a demanda. El JSON se regenera aparte cada 15 min.
  var SYNC_URL='https://script.google.com/macros/s/AKfycbyrG0n6aA9xGT6MTiMDLYwG3CD0E5ym5JdFAn89d6jcwludo2uJJem0xgO0q3jSEc72/exec?accion=sincronizar';

  var ALL=[], VIEW=[], ORDER=[], curIndex=-1, CAL=[], calBuilt=false;
  var FILT_LS_KEY='galeriaFiltrosV1', filtrosListos=false;
  var FAV_LS_KEY='galeriaFavoritosV1', soloFav=false;
  var FAVS=(function(){try{return new Set(JSON.parse(localStorage.getItem(FAV_LS_KEY))||[]);}catch(e){return new Set();}})();
  function saveFavs(){try{localStorage.setItem(FAV_LS_KEY,JSON.stringify(Array.from(FAVS)));}catch(e){}}
  function toggleFav(id){if(FAVS.has(id))FAVS.delete(id);else FAVS.add(id);saveFavs();}
  function $(id){return document.getElementById(id);}
  function ic(name,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>';}
  function fmtN(n){try{return n.toLocaleString('es-VE');}catch(e){return String(n);}}

  function cargarDatos(cb){
    fetch(DATOS_URL,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(data){
      CAL=data.calendario||[];
      onData(data.contenido||[]);
      marcarActualizado(data.actualizado);
      hideSplash();
      if(cb)cb(null);
    }).catch(function(e){ hideSplash(); if(cb)cb(e); else onErr(e); });
  }
  function marcarActualizado(iso){
    var el=$('updinfo'); if(!el||!iso)return;
    try{ el.textContent='Última actualización: '+new Date(iso).toLocaleString('es-VE',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(e){}
  }
  // ── Portada animada: se muestra al abrir la galería (una vez por sesión) ──
  var SPLASH_T0=Date.now(), splashDone=false;
  (function(){
    var seen=false; try{seen=sessionStorage.getItem('galeriaSplashV1')==='1';sessionStorage.setItem('galeriaSplashV1','1');}catch(e){}
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(seen||reduce){var sp=$('splash');if(sp)sp.remove();splashDone=true;}
    else setTimeout(hideSplash,6000); // por si los datos tardan demasiado
  })();
  function hideSplash(){
    if(splashDone)return;splashDone=true;
    var sp=$('splash');if(!sp)return;
    var wait=Math.max(0,1500-(Date.now()-SPLASH_T0));
    setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.remove();},700);},wait);
  }
  // ── Estrellas del fondo ──
  (function(){
    var box=$('stars');if(!box)return;var h='';
    for(var i=0;i<26;i++){
      var sz=Math.random()<.2?2:1.5;
      h+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;top:'+(Math.random()*100).toFixed(1)+'%;width:'+sz+'px;height:'+sz+'px;animation-delay:-'+(Math.random()*6).toFixed(1)+'s;animation-duration:'+(3+Math.random()*4).toFixed(1)+'s"></i>';
    }
    box.innerHTML=h;
  })();
  // ── Números de la portada (cuentan hacia arriba) ──
  var statsShown=false;
  function countUp(el,to){
    var t0=null,dur=1100;
    function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmtN(Math.round(to*e));if(k<1)requestAnimationFrame(f);}
    requestAnimationFrame(f);
  }
  function updateHero(){
    var hero=$('hero');if(!hero)return;
    var clean=!$('q').value.trim()&&!soloFav&&FKEYS.every(function(p){return !val(p[0]);});
    hero.classList.toggle('off',!clean);
    if(statsShown||!ALL.length)return;statsShown=true;
    var alb={},sed={},vid=0;
    ALL.forEach(function(r){if(r.tipo==='Video')vid++;if(r.album)alb[r.album]=1;if(r.sede)sed[r.sede]=1;});
    var vals={'st-files':ALL.length,'st-videos':vid,'st-albums':Object.keys(alb).length,'st-sedes':Object.keys(sed).length};
    var delay=splashDone?250:Math.max(300,1700-(Date.now()-SPLASH_T0));
    setTimeout(function(){Object.keys(vals).forEach(function(id){countUp($(id),vals[id]);});},delay);
  }

  function boot(){
    var s=$('skel'); for(var i=0;i<12;i++){s.appendChild(document.createElement('div'));}
    cargarDatos();
  }
  function onErr(e){$('main').innerHTML='<div class="state">'+ic('info')+'<div class="big">No se pudo cargar</div>Revisa tu conexión e inténtalo de nuevo.<br><small style="color:var(--dim)">'+esc(String(e))+'</small></div>';}
  function norm(s){return String(s==null?'':s).toLowerCase()
      .replace(/[áàäâã]/g,'a').replace(/[éèëê]/g,'e')
      .replace(/[íìïî]/g,'i').replace(/[óòöôõ]/g,'o')
      .replace(/[úùüû]/g,'u').replace(/ñ/g,'n');}

  // ── Nombres legibles a partir del nombre técnico de la carpeta ──
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var SEDES={'San Cristobal':'San Cristóbal'};
  function cap(s){s=String(s||'').trim();return s.charAt(0).toUpperCase()+s.slice(1);}
  function human(s){return cap(String(s||'').replace(/_/g,' ').replace(/\s+/g,' ').replace(/[\s\-]+$/,''));}
  function svcLabel(s){return String(s||'').replace(/^\d+_/,'').trim();}
  function prettyDate(album,r){
    var m=String(album).match(/(20\d{2})-(\d{2})-(\d{2})/);
    if(m)return (+m[3])+' '+MESES[(+m[2])-1]+' '+m[1];
    m=String((r.fecha||'')+' '+album).match(/(\d{1,2})\/(\d{1,2})\/(20\d{2})/);
    if(m)return (+m[1])+' '+MESES[(+m[2])-1]+' '+m[3];
    return r._year||'';
  }
  function prettyGroup(g){
    g=String(g||'').trim();
    if(!g||g.length>24||!/^[a-z0-9_.\-]+$/i.test(g))return '';
    if(!/^([a-z]{2,4}[_\-]?)?\d/i.test(g))return '';
    return g.toUpperCase().replace(/_/g,'-');
  }
  var INFO={};
  function albumInfo(r){
    var a=r.album||'';
    if(INFO[a])return INFO[a];
    var gp=/^GOOGLE FOTOS\s*·/i.test(a), title='';
    if(gp){
      title=a.replace(/^GOOGLE FOTOS\s*·\s*/i,'').replace(/\s*\((\d+|enlace)\)\s*$/i,'');
    } else if(/^EVENTOS\s*-/i.test(a)){
      title=human(a.split(/\s+-\s+/)[1]||'');
    } else {
      var ev=String(r.evento||'').split(' / ')[0].trim();
      if(ev && !/^general$/i.test(ev)) title=human(ev);
      else if(r.tipoEvento && r.tipoEvento!=='Sin especificar') title=r.tipoEvento;
    }
    var svc=svcLabel(r.servicio), svcInTitle=false;
    if(!title && svc){ title=svc; svcInTitle=true; }
    if(!title) title=a?'Contenido general':'Sin álbum';
    var info={title:title,svc:svcInTitle?'':svc,sede:SEDES[r.sede]||r.sede||'',date:prettyDate(a,r),group:prettyGroup(r.grupo),gp:gp};
    INFO[a]=info; return info;
  }
  function metaHtml(inf){
    var p=[];
    if(inf.gp)p.push('<span class="gpb">'+ic('photos')+'Google Fotos</span>');
    if(inf.svc)p.push('<span class="svc">'+esc(inf.svc.toUpperCase())+'</span>');
    if(inf.sede)p.push('<span>'+esc(inf.sede)+'</span>');
    if(inf.date)p.push('<span>'+esc(inf.date)+'</span>');
    if(inf.group)p.push('<span>'+esc(inf.group)+'</span>');
    return '<div class="gm">'+p.join('')+'</div>';
  }

  var FKEYS=[['f-servicio','servicio'],['f-sede','sede'],['f-anio','_fecha'],['f-estado','estado'],
             ['f-tipo','tipo'],['f-tipoevento','tipoEvento']];

  function onData(rows){
    ALL=rows||[]; INFO={};
    ALL.forEach(function(r){
      var y=(r.anio||'').match(/20\d{2}/);if(!y)y=(r.fecha||'').match(/20\d{2}/);if(!y)y=(r.album||'').match(/20\d{2}/);
      r._year=y?y[0]:'';
      var ff=(r.fecha||'').trim();r._fecha=(ff&&ff.indexOf('(Fecha)')<0)?ff:(r.anio||(y?y[0]:''));
      r._info=albumInfo(r);
      r._hay=norm([r.nombre,r.album,r._info.title,r.grupo,r.servicio,r.sede,r.evento,r.tipoEvento,r.tipo,r.estado,r._fecha,r._year].join(' '));
    });
    // Primero lo registrado más recientemente; empate → fecha del evento.
    ALL.sort(function(a,b){
      var ra=a.fechaRegistro||'', rb=b.fechaRegistro||'';
      if(ra!==rb) return rb.localeCompare(ra);
      return String(b._fecha||'').localeCompare(String(a._fecha||''));
    });
    apply();
    if(!filtrosListos){filtrosListos=true;if(restoreFiltros())apply();}
  }

  function saveFiltros(){
    try{
      var s={q:$('q').value};
      FKEYS.forEach(function(p){s[p[0]]=$(p[0]).value;});
      localStorage.setItem(FILT_LS_KEY,JSON.stringify(s));
    }catch(e){}
  }
  function restoreFiltros(){
    try{
      var raw=localStorage.getItem(FILT_LS_KEY); if(!raw)return false;
      var s=JSON.parse(raw), changed=false;
      if(s.q){$('q').value=s.q;changed=true;}
      FKEYS.forEach(function(p){
        var v=s[p[0]];if(!v)return;
        var sel=$(p[0]);
        for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===v){sel.value=v;changed=true;break;} }
      });
      return changed;
    }catch(e){return false;}
  }
  function tokens(){return norm($('q').value).split(/\s+/).filter(Boolean);}
  function val(id){return $(id).value;}
  function passes(r,skip){
    for(var i=0;i<FKEYS.length;i++){
      var id=FKEYS[i][0];if(id===skip)continue;
      var v=val(id);if(v&&r[FKEYS[i][1]]!==v)return false;
    }
    var t=tokens();for(var j=0;j<t.length;j++){if(r._hay.indexOf(t[j])<0)return false;}
    return true;
  }
  function buildFilters(){
    FKEYS.forEach(function(p){
      var id=p[0],key=p[1],counts={};
      ALL.forEach(function(r){if(r[key]&&passes(r,id))counts[r[key]]=(counts[r[key]]||0)+1;});
      var cur=val(id);if(cur&&counts[cur]===undefined)counts[cur]=0;
      var opts=Object.keys(counts).sort();if(key==='_fecha')opts.reverse();
      fill(id,opts,counts);$(id).value=cur;$(id).classList.toggle('set',!!cur);
    });
  }
  function fill(id,vals,counts){
    var sel=$(id);
    var first=sel.getAttribute('data-label')||sel.options[0].text;sel.setAttribute('data-label',first);
    sel.innerHTML='<option value="">'+first+'</option>';
    vals.forEach(function(v){var o=document.createElement('option');o.value=v;
      o.textContent=(id==='f-servicio'?svcLabel(v):(SEDES[v]||v))+'  ('+fmtN(counts[v]||0)+')';sel.appendChild(o);});
  }
  function renderChips(){
    var c=$('chips'),html='',q=$('q').value.trim(),activeCount=0;
    if(q)html+='<span class="fchip" data-k="q">“'+esc(q)+'”'+ic('x')+'</span>';
    FKEYS.forEach(function(p){var v=val(p[0]);
      if(v){activeCount++;
        var lab=p[0]==='f-servicio'?svcLabel(v):(SEDES[v]||v);
        html+='<span class="fchip" data-k="'+p[0]+'">'+esc(lab)+ic('x')+'</span>';}});
    $('fcount').textContent=activeCount;
    $('ftoggle').classList.toggle('active',activeCount>0);
    c.innerHTML=html;c.style.display=html?'flex':'none';
    $('qclear').classList.toggle('show',!!q);
  }
  $('chips').addEventListener('click',function(e){
    var el=e.target.closest('.fchip');if(!el)return;
    var k=el.getAttribute('data-k');
    if(k==='q')$('q').value='';else $(k).value='';
    apply();
  });

  function apply(){
    buildFilters();
    VIEW=ALL.filter(function(r){return passes(r,null) && (!soloFav || FAVS.has(r.driveId));});
    $('count').textContent=(VIEW.length===ALL.length)?(fmtN(ALL.length)+' archivos'):(fmtN(VIEW.length)+' de '+fmtN(ALL.length));
    $('fapply').textContent=VIEW.length?('Ver '+fmtN(VIEW.length)+' archivo'+(VIEW.length===1?'':'s')):'Sin resultados';
    renderChips();render();syncQF();updateHero();
    if(filtrosListos)saveFiltros();
  }

  function render(){
    var main=$('main');
    ORDER=[];
    if(!VIEW.length){
      main.innerHTML='<div class="state">'+ic('search')+'<div class="big">Sin resultados</div>Prueba con otra búsqueda u otros filtros.<br><button class="btn ghost" id="emptyclear">Limpiar filtros</button></div>';
      var ec=$('emptyclear'); if(ec)ec.onclick=clearAll;
      return;
    }
    var groups={},order=[];
    // Los álbumes que siguen en Google Fotos (sin migrar) se juntan en una sola sección.
    VIEW.forEach(function(r){var g=String(r.driveId||'').indexOf('gphotos:')===0?'__gp__':(r.album||'');if(!groups[g]){groups[g]=[];order.push(g);}groups[g].push(r);});
    var html='';
    order.forEach(function(g){
      var list=groups[g], inf=list[0]._info;
      var head=(g==='__gp__')
        ? '<div class="gt">Álbumes en Google Fotos</div><div class="gm"><span class="gpb">'+ic('photos')+'Todavía no pasados a Drive</span></div>'
        : '<div class="gt">'+esc(inf.title)+'</div>'+metaHtml(inf);
      html+='<section class="grp"><div class="ghead"><div class="ghead-t">'+head+'</div>'
        +'<div class="gn">'+fmtN(list.length)+'</div></div><div class="grid">';
      list.forEach(function(r,k){
        r._i=ORDER.length; r._gi=k; r._gn=list.length; ORDER.push(r);
        var isGp=String(r.driveId||'').indexOf('gphotos:')===0, fav=FAVS.has(r.driveId);
        html+='<div class="card'+(isGp?' gp':'')+'" data-i="'+r._i+'" data-drive="'+esc(r.driveId)+'">';
        if(isGp){
          var m=String(r.nombre||'').match(/^(\d+)/);
          html+='<div class="gpin">'+ic('photos')+'<b>'+esc(r._info.title)+'</b>'+(m?'<small>'+fmtN(+m[1])+' elementos</small>':'')+'</div>';
        } else {
          html+='<div class="ph spin">'+ic('image')+'</div>';
          if(r.tipo==='Video')html+='<span class="vb">'+ic('play','fill')+'</span>';
        }
        html+='<button class="fav'+(fav?' on':'')+'" aria-label="Favorito" aria-pressed="'+fav+'">'+ic('star')+'</button></div>';
      });
      html+='</div></section>';
    });
    main.innerHTML=html;
    observeThumbs();
  }

  var io;
  function observeThumbs(){
    if(io)io.disconnect();
    io=new IntersectionObserver(function(entries){entries.forEach(function(en){if(en.isIntersecting){var c=en.target;io.unobserve(c);loadThumb(c);}});},{rootMargin:'300px'});
    document.querySelectorAll('.card:not(.gp)').forEach(function(c){io.observe(c);});
    // Red de seguridad: si el observador no dispara a tiempo (listas grandes,
    // pestaña en segundo plano, filtros muy seguidos), forzamos la carga de las
    // miniaturas que sigan "cargando", usando solo tarjetas que existen ahora.
    setTimeout(function(){
      document.querySelectorAll('.card .ph.spin').forEach(function(ph){
        var c=ph.closest('.card'); if(c)loadThumb(c);
      });
    },2500);
  }
  function loadThumb(card){
    var id=card.getAttribute('data-drive');
    if(!id||card.getAttribute('data-loading'))return;
    card.setAttribute('data-loading','1');
    tryLoadThumb(card,'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400',true);
  }
  function tryLoadThumb(card,url,allowRetry){
    var img=new Image();
    img.onload=function(){setThumb(card,url);};
    img.onerror=function(){
      if(allowRetry){ setTimeout(function(){tryLoadThumb(card,url,false);},900); }
      else { setPh(card); }
    };
    img.src=url;
  }
  function setThumb(card,src){
    if(card.querySelector('.thumb'))return;
    var img=document.createElement('img');img.className='thumb';img.decoding='async';img.alt='';
    img.onload=function(){img.classList.add('in');var ph=card.querySelector('.ph');if(ph)setTimeout(function(){ph.remove();},450);};
    img.src=src;card.insertBefore(img,card.firstChild);
  }
  function setPh(card){var ph=card.querySelector('.ph');if(ph)ph.classList.remove('spin');}

  $('main').addEventListener('click',function(e){
    var card=e.target.closest('.card');if(!card)return;
    var fb=e.target.closest('.fav');
    if(fb){e.stopPropagation();toggleFavUI(fb,card.getAttribute('data-drive'));return;}
    openLB(parseInt(card.getAttribute('data-i'),10));
  });

  // ── Visor ──
  function openLB(i){
    curIndex=i;var r=ORDER[i];if(!r)return;
    var lb=$('lb'); if(!lb.classList.contains('show')){lb.classList.add('show');document.body.classList.add('noscroll');}
    var stage=$('lbimg'), id=r.driveId, inf=r._info;
    var isGp=String(id||'').indexOf('gphotos:')===0;
    $('lbcount').textContent=fmtN(r._gi+1)+' / '+fmtN(r._gn);
    $('lbprev').disabled=(i<=0); $('lbnext').disabled=(i>=ORDER.length-1);
    stage.className='spinbox';stage.innerHTML=ic('loader');
    var amb=$('lbamb');
    if(isGp){amb.classList.remove('on');}
    else{amb.classList.remove('on');amb.style.backgroundImage='url("https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400")';
      requestAnimationFrame(function(){requestAnimationFrame(function(){amb.classList.add('on');});});}
    if(isGp){
      var m=String(r.nombre||'').match(/^(\d+)/);
      stage.className='';

  // ── Pellizcar para cambiar columnas (móvil, como la app Fotos) ──
  (function(){
    var GCOLS_MIN=2, GCOLS_MAX=6, GCOLS_DENSE_AT=4, GCOLS_KEY='galeriaGColsV1';
    var gcols=parseInt(localStorage.getItem(GCOLS_KEY),10);
    if(!gcols||gcols<GCOLS_MIN||gcols>GCOLS_MAX)gcols=2;
    var GAP={2:8,3:5,4:3,5:2,6:2}, RAD={2:14,3:10,4:6,5:4,6:3};
    function paint(){
      var st=document.documentElement.style;
      st.setProperty('--gcols',gcols);st.setProperty('--ggap',GAP[gcols]+'px');st.setProperty('--cr',RAD[gcols]+'px');
      document.body.classList.toggle('gcols-dense',gcols>=GCOLS_DENSE_AT);
    }
    function setGCols(n){
      n=Math.max(GCOLS_MIN,Math.min(GCOLS_MAX,n));
      if(n===gcols)return;
      gcols=n;paint();
      try{localStorage.setItem(GCOLS_KEY,gcols);}catch(e){}
    }
    paint();
    var main=$('main'); if(!main)return;
    var startDist=0,startCols=gcols,pinching=false;
    function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
    main.addEventListener('touchstart',function(e){
      if(e.touches.length===2){pinching=true;startDist=dist(e.touches);startCols=gcols;e.preventDefault();}
      else pinching=false;
    },{passive:false});
    main.addEventListener('touchmove',function(e){
      if(!pinching||e.touches.length!==2||!startDist)return;
      // Bloquea el zoom de página del navegador mientras se cambian columnas.
      e.preventDefault();
      var ratio=dist(e.touches)/startDist;
      setGCols(startCols+Math.round((1-ratio)*6));
    },{passive:false});
    main.addEventListener('touchend',function(e){if(e.touches.length<2)pinching=false;},{passive:true});
  })();

    }
    function buildMes(){var s={};CAL.forEach(function(r){if(r.mes)s[r.mes]=1;});var meses=Object.keys(s).sort();selm.innerHTML="<option value=\"\">Todos los meses</option>"+meses.map(function(m){return "<option value=\""+e2(m)+"\">"+e2(m)+"</option>";}).join("");selm.onchange=renderTabla;}
    function setView(vw){CALVIEW=vw;document.getElementById("cal-vmes").classList.toggle("active",vw==="mes");document.getElementById("cal-vtab").classList.toggle("active",vw==="tabla");document.getElementById("calctrl-mes").style.display=(vw==="mes")?"":"none";selm.style.display=(vw==="tabla")?"":"none";if(vw==="mes")renderMes();else renderTabla();}
    b.onclick=function(){
      w.classList.add("show");
      if(CAL.length){ if(!calBuilt){buildMes();calBuilt=true;} setView("mes"); return; }
      body.innerHTML="<div style=\"padding:40px;text-align:center;color:var(--muted)\">Cargando calendario…</div>";
      cargarDatos(function(err){
        if(err){body.innerHTML="<div style=\"padding:40px;text-align:center;color:var(--muted)\">No se pudo cargar el calendario</div>";return;}
        buildMes();calBuilt=true;setView("mes");
      });
    };
    document.getElementById("cal-vmes").onclick=function(){setView("mes");};
    document.getElementById("cal-vtab").onclick=function(){setView("tabla");};
    document.getElementById("cal-prev").onclick=function(){DISP.m0--;if(DISP.m0<0){DISP.m0=11;DISP.y--;}renderMes();};
    document.getElementById("cal-next").onclick=function(){DISP.m0++;if(DISP.m0>11){DISP.m0=0;DISP.y++;}renderMes();};
    document.getElementById("calclose").onclick=function(){w.classList.remove("show");};
    document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&w.classList.contains("show"))w.classList.remove("show");});
  });

  boot();
</script>

<div class="calwrap" id="calwrap"><div class="calbar"><div class="ctit">Calendario</div><div class="calviews"><button id="cal-vmes" class="calviewbtn active">Mes</button><button id="cal-vtab" class="calviewbtn">Tabla</button></div><div class="calctrl" id="calctrl-mes"><button class="calnav" id="cal-prev">‹</button><span class="callabel" id="cal-label"></span><button class="calnav" id="cal-next">›</button></div><select id="calmes" style="display:none"></select><button class="cclose" id="calclose" title="Cerrar">✕</button></div><div class="calbody" id="calbody"></div></div>
</body>
</html>
